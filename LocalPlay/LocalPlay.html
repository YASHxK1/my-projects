<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalPlay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: #181a1f;
      --panel-2: #20232a;
      --line: #30343d;
      --text: #f3f4f7;
      --muted: #a4a9b4;
      --soft: #6f7785;
      --accent: #46c1a8;
      --accent-strong: #35a88f;
      --danger: #ef6969;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.28);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(70, 193, 168, 0.08), transparent 34%),
        linear-gradient(315deg, rgba(229, 106, 106, 0.07), transparent 32%),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      min-height: 38px;
      padding: 8px 12px;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      background: #282c34;
      border-color: #444a56;
    }

    button:active {
      transform: translateY(1px);
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #06110f;
      font-weight: 700;
    }

    button.primary:hover {
      background: var(--accent-strong);
      border-color: var(--accent-strong);
    }

    button.ghost {
      background: transparent;
    }

    button.icon {
      width: 38px;
      padding: 0;
      display: inline-grid;
      place-items: center;
    }

    button[disabled] {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: rgba(24, 26, 31, 0.86);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .brand {
      padding: 22px 20px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .folder-actions {
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .folder-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .folder-name {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
      min-height: 18px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #121418;
      color: var(--text);
      min-height: 38px;
      padding: 8px 10px;
      outline: none;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 8px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .playlist {
      flex: 1;
      overflow: auto;
      padding: 0 10px 14px;
    }

    .video-item {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      text-align: left;
      padding: 10px;
      min-height: 54px;
    }

    .video-item:hover {
      background: #20232a;
      border-color: #2d323b;
    }

    .video-item.active {
      background: rgba(70, 193, 168, 0.13);
      border-color: rgba(70, 193, 168, 0.45);
    }

    .video-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      line-height: 1.3;
    }

    .video-meta {
      color: var(--soft);
      font-size: 12px;
      margin-top: 3px;
    }

    .progress-pill {
      border-radius: 999px;
      border: 1px solid #3a404b;
      color: var(--muted);
      min-width: 44px;
      padding: 3px 7px;
      text-align: center;
      font-size: 12px;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: minmax(280px, 1fr) auto;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      padding: 28px;
      min-width: 0;
    }

    .empty-state {
      max-width: 520px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state h2 {
      color: var(--text);
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .empty-state p {
      margin: 0 0 18px;
      line-height: 1.55;
    }

    .player-shell {
      width: min(100%, 1180px);
      display: none;
      gap: 14px;
    }

    .player-shell.ready {
      display: grid;
    }

    video {
      width: 100%;
      max-height: calc(100vh - 210px);
      min-height: 280px;
      background: #050607;
      border-radius: 8px;
      box-shadow: var(--shadow);
      outline: 1px solid rgba(255, 255, 255, 0.08);
    }

    .now-playing {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .now-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .now-details {
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      border-top: 1px solid var(--line);
      background: rgba(16, 17, 20, 0.92);
      padding: 14px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .control-left,
    .control-right {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .control-left {
      justify-content: flex-start;
    }

    .control-right {
      justify-content: flex-end;
    }

    .timeline {
      display: grid;
      grid-template-columns: auto minmax(120px, 1fr) auto;
      align-items: center;
      gap: 10px;
      min-width: min(100%, 460px);
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      accent-color: var(--accent);
    }

    .seek {
      width: 100%;
    }

    .volume {
      width: 90px;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      min-height: 38px;
      padding: 7px 9px;
      outline: none;
    }

    .status {
      min-height: 22px;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .sidebar {
        max-height: 42vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        padding: 16px;
      }

      .stage {
        padding: 16px;
      }

      video {
        max-height: 48vh;
        min-height: 210px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .control-right {
        justify-content: flex-start;
      }

      .timeline {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>LocalPlay</h1>
        <p>A private Chrome player for videos already on this computer.</p>
      </div>

      <div class="folder-actions">
        <div class="folder-row">
          <button class="primary" id="selectFolderBtn" type="button">Select Folder</button>
          <button class="icon ghost" id="restoreFolderBtn" type="button" title="Restore last folder" disabled aria-label="Restore last folder">&#8635;</button>
        </div>
        <button class="ghost" id="fallbackFolderBtn" type="button">Use fallback picker</button>
        <div class="folder-name" id="folderName">No folder selected</div>
      </div>

      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search videos" autocomplete="off">
      </div>

      <div class="playlist-header">
        <span>Playlist</span>
        <span id="playlistCount">0</span>
      </div>
      <div class="playlist" id="playlist"></div>
    </aside>

    <main class="main">
      <section class="stage">
        <div class="empty-state" id="emptyState">
          <h2 id="emptyTitle">Pick a folder to start watching.</h2>
          <p id="emptyCopy">LocalPlay lists videos from the folder you choose and keeps playback history inside this Chrome profile.</p>
          <button class="primary" id="emptySelectBtn" type="button">Select Folder</button>
        </div>

        <div class="player-shell" id="playerShell">
          <video id="video" controls playsinline></video>
          <div class="now-playing">
            <h2 class="now-title" id="nowTitle">Nothing playing</h2>
            <div class="now-details" id="nowDetails"></div>
            <div class="status" id="status"></div>
          </div>
        </div>
      </section>

      <section class="controls">
        <div class="control-left">
          <button class="icon" id="playPauseBtn" type="button" title="Play or pause" aria-label="Play or pause">&#9654;</button>
          <div class="timeline">
            <span id="currentTime">0:00</span>
            <input class="seek" id="seekRange" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <span id="duration">0:00</span>
          </div>
          <button class="icon" id="muteBtn" type="button" title="Mute" aria-label="Mute">&#128266;</button>
          <input class="volume" id="volumeRange" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
        </div>

        <div class="control-right">
          <select id="speedSelect" aria-label="Playback speed">
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button id="subtitleToggleBtn" type="button" disabled>Subtitles Off</button>
          <button id="loadSubtitleBtn" type="button" disabled>Load Subtitle</button>
        </div>
      </section>
    </main>
  </div>

  <input class="hidden" id="folderInput" type="file" webkitdirectory multiple>
  <input class="hidden" id="subtitleInput" type="file" accept=".srt,.vtt,text/vtt,text/plain">

  <script>
    const VIDEO_EXTENSIONS = new Set(["mp4", "webm", "mkv", "ogg", "ogv", "mov", "m4v"]);
    const SUBTITLE_EXTENSIONS = new Set(["srt", "vtt"]);
    const HANDLE_STORE = "handles";
    const POSITION_PREFIX = "localplay.position.";
    const DB_NAME = "localplay-db";
    const DB_VERSION = 1;

    const els = {
      selectFolderBtn: document.getElementById("selectFolderBtn"),
      restoreFolderBtn: document.getElementById("restoreFolderBtn"),
      fallbackFolderBtn: document.getElementById("fallbackFolderBtn"),
      emptySelectBtn: document.getElementById("emptySelectBtn"),
      folderName: document.getElementById("folderName"),
      searchInput: document.getElementById("searchInput"),
      playlist: document.getElementById("playlist"),
      playlistCount: document.getElementById("playlistCount"),
      emptyState: document.getElementById("emptyState"),
      emptyTitle: document.getElementById("emptyTitle"),
      emptyCopy: document.getElementById("emptyCopy"),
      playerShell: document.getElementById("playerShell"),
      video: document.getElementById("video"),
      nowTitle: document.getElementById("nowTitle"),
      nowDetails: document.getElementById("nowDetails"),
      status: document.getElementById("status"),
      playPauseBtn: document.getElementById("playPauseBtn"),
      seekRange: document.getElementById("seekRange"),
      currentTime: document.getElementById("currentTime"),
      duration: document.getElementById("duration"),
      muteBtn: document.getElementById("muteBtn"),
      volumeRange: document.getElementById("volumeRange"),
      speedSelect: document.getElementById("speedSelect"),
      subtitleToggleBtn: document.getElementById("subtitleToggleBtn"),
      loadSubtitleBtn: document.getElementById("loadSubtitleBtn"),
      folderInput: document.getElementById("folderInput"),
      subtitleInput: document.getElementById("subtitleInput")
    };

    const state = {
      db: null,
      folderHandle: null,
      folderId: "",
      videos: [],
      subtitles: new Map(),
      currentVideo: null,
      currentObjectUrl: "",
      currentTrackUrl: "",
      saveTimer: 0,
      userSeeking: false,
      subtitlesEnabled: true
    };

    init();

    async function init() {
      state.db = await openDb();
      els.restoreFolderBtn.disabled = !(await getFromStore("lastFolder"));
      wireEvents();
      setStatus("Select a folder to build your local playlist.");
    }

    function wireEvents() {
      els.selectFolderBtn.addEventListener("click", selectFolder);
      els.emptySelectBtn.addEventListener("click", selectFolder);
      els.restoreFolderBtn.addEventListener("click", restoreLastFolder);
      els.fallbackFolderBtn.addEventListener("click", () => els.folderInput.click());
      els.folderInput.addEventListener("change", handleFallbackFolder);
      els.searchInput.addEventListener("input", renderPlaylist);
      els.playPauseBtn.addEventListener("click", togglePlay);
      els.video.addEventListener("play", syncPlayButton);
      els.video.addEventListener("pause", syncPlayButton);
      els.video.addEventListener("loadedmetadata", handleLoadedMetadata);
      els.video.addEventListener("timeupdate", handleTimeUpdate);
      els.video.addEventListener("durationchange", updateTimeline);
      els.video.addEventListener("volumechange", syncVolume);
      els.video.addEventListener("ended", playNextVideo);
      els.video.addEventListener("error", handleVideoError);
      els.seekRange.addEventListener("input", handleSeekInput);
      els.seekRange.addEventListener("change", handleSeekCommit);
      els.volumeRange.addEventListener("input", () => {
        els.video.volume = Number(els.volumeRange.value);
        els.video.muted = els.video.volume === 0;
      });
      els.muteBtn.addEventListener("click", () => {
        els.video.muted = !els.video.muted;
      });
      els.speedSelect.addEventListener("change", () => {
        els.video.playbackRate = Number(els.speedSelect.value);
      });
      els.subtitleToggleBtn.addEventListener("click", toggleSubtitles);
      els.loadSubtitleBtn.addEventListener("click", () => els.subtitleInput.click());
      els.subtitleInput.addEventListener("change", handleManualSubtitle);
      window.addEventListener("beforeunload", saveCurrentPosition);
      document.addEventListener("keydown", handleShortcuts);
    }

    async function selectFolder() {
      if ("showDirectoryPicker" in window) {
        try {
          const handle = await window.showDirectoryPicker({ mode: "read" });
          await putInStore("lastFolder", handle);
          els.restoreFolderBtn.disabled = false;
          await loadFromDirectoryHandle(handle);
          return;
        } catch (error) {
          if (error.name === "AbortError") return;
          setStatus("Chrome could not open the native folder picker. Try the fallback picker.", true);
        }
      } else {
        setStatus("Native folder access is unavailable here. Use the fallback picker.", true);
      }

      els.folderInput.click();
    }

    async function restoreLastFolder() {
      const handle = await getFromStore("lastFolder");
      if (!handle) {
        setStatus("No saved folder is available yet.", true);
        return;
      }

      const allowed = await ensurePermission(handle);
      if (!allowed) {
        setStatus("Chrome needs folder permission again. Please select the folder.", true);
        els.folderInput.click();
        return;
      }

      await loadFromDirectoryHandle(handle);
    }

    async function loadFromDirectoryHandle(handle) {
      state.folderHandle = handle;
      state.folderId = "handle:" + handle.name;
      const videos = [];
      const subtitles = new Map();

      setStatus("Scanning selected folder...");
      for await (const entry of handle.values()) {
        if (entry.kind !== "file") continue;
        const info = parseFileName(entry.name);
        if (VIDEO_EXTENSIONS.has(info.ext)) {
          const file = await entry.getFile();
          videos.push(makeMediaRecord(file, entry, handle.name));
        }
        if (SUBTITLE_EXTENSIONS.has(info.ext)) {
          subtitles.set(info.base.toLowerCase(), entry);
        }
      }

      applyLibrary(handle.name, videos, subtitles);
    }

    function handleFallbackFolder(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      const rootName = files[0].webkitRelativePath.split("/")[0] || "Selected folder";
      const videos = [];
      const subtitles = new Map();

      for (const file of files) {
        const info = parseFileName(file.name);
        if (VIDEO_EXTENSIONS.has(info.ext)) {
          videos.push(makeMediaRecord(file, null, rootName));
        }
        if (SUBTITLE_EXTENSIONS.has(info.ext)) {
          subtitles.set(info.base.toLowerCase(), file);
        }
      }

      state.folderHandle = null;
      state.folderId = "fallback:" + rootName;
      applyLibrary(rootName, videos, subtitles);
      event.target.value = "";
    }

    function applyLibrary(folderName, videos, subtitles) {
      revokeCurrentMediaUrls();
      state.videos = videos.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      state.subtitles = subtitles;
      state.currentVideo = null;
      els.video.removeAttribute("src");
      els.video.load();
      els.folderName.textContent = folderName;
      els.nowTitle.textContent = "Nothing playing";
      els.nowDetails.textContent = "";
      els.playerShell.classList.remove("ready");
      els.loadSubtitleBtn.disabled = true;
      els.subtitleToggleBtn.disabled = true;
      renderPlaylist();

      if (state.videos.length) {
        setEmptyState(
          "Choose a video from the playlist.",
          "Your folder is ready. Pick any item on the left to load it into the player."
        );
        setStatus("Found " + state.videos.length + " playable video" + (state.videos.length === 1 ? "." : "s."));
      } else {
        setEmptyState(
          "No playable videos found.",
          "Choose another folder or use files Chrome can decode, such as MP4 or WebM."
        );
        setStatus("No Chrome-playable video files were found in that folder.", true);
      }
    }

    function makeMediaRecord(file, handle, folderName) {
      return {
        file,
        handle,
        name: file.name,
        base: parseFileName(file.name).base,
        size: file.size,
        modified: file.lastModified,
        folderName,
        key: state.folderId + ":" + file.name + ":" + file.size + ":" + file.lastModified
      };
    }

    function renderPlaylist() {
      const query = els.searchInput.value.trim().toLowerCase();
      const filtered = state.videos.filter((item) => item.name.toLowerCase().includes(query));
      els.playlist.innerHTML = "";
      els.playlistCount.textContent = String(filtered.length);

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "video-meta";
        empty.style.padding = "10px";
        empty.textContent = state.videos.length ? "No videos match your search." : "No videos loaded.";
        els.playlist.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const item of filtered) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "video-item" + (state.currentVideo && state.currentVideo.key === item.key ? " active" : "");
        button.addEventListener("click", () => loadVideo(item, true));

        const text = document.createElement("div");
        text.style.minWidth = "0";

        const title = document.createElement("div");
        title.className = "video-title";
        title.textContent = item.name;
        text.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "video-meta";
        meta.textContent = formatBytes(item.size);
        text.appendChild(meta);

        const progress = document.createElement("span");
        progress.className = "progress-pill";
        progress.textContent = getProgressLabel(item);

        button.appendChild(text);
        button.appendChild(progress);
        fragment.appendChild(button);
      }
      els.playlist.appendChild(fragment);
    }

    async function loadVideo(item, shouldPlay) {
      saveCurrentPosition();
      revokeCurrentMediaUrls();
      state.currentVideo = item;
      state.currentObjectUrl = URL.createObjectURL(item.file);
      els.video.src = state.currentObjectUrl;
      els.video.playbackRate = Number(els.speedSelect.value);
      els.video.muted = false;
      els.playerShell.classList.add("ready");
      els.emptyState.classList.add("hidden");
      els.nowTitle.textContent = item.name;
      els.nowDetails.textContent = item.folderName + " - " + formatBytes(item.size);
      els.loadSubtitleBtn.disabled = false;
      renderPlaylist();
      clearTracks();
      await attachAutoSubtitle(item);

      const saved = getSavedPosition(item);
      if (saved > 1) {
        setStatus("Resume point ready at " + formatTime(saved) + ".");
      } else {
        setStatus("Playing " + item.name);
      }

      els.video.load();
      if (shouldPlay) {
        try {
          await els.video.play();
        } catch {
          setStatus("Loaded. Press play when Chrome is ready.", false);
        }
      }
    }

    async function attachAutoSubtitle(item) {
      const match = state.subtitles.get(item.base.toLowerCase());
      if (!match) {
        setSubtitleState(false, "Subtitles Off");
        return;
      }

      try {
        const file = match instanceof File ? match : await match.getFile();
        await attachSubtitleFile(file, "Auto subtitles loaded.");
      } catch {
        setStatus("Subtitle match was found but could not be loaded.", true);
        setSubtitleState(false, "Subtitles Off");
      }
    }

    async function handleManualSubtitle(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        await attachSubtitleFile(file, "Subtitle loaded.");
      } catch {
        setStatus("That subtitle file could not be loaded.", true);
      } finally {
        event.target.value = "";
      }
    }

    async function attachSubtitleFile(file, message) {
      clearTracks();
      const info = parseFileName(file.name);
      let blob = file;

      if (info.ext === "srt") {
        const srt = await file.text();
        blob = new Blob([srtToVtt(srt)], { type: "text/vtt" });
      }

      state.currentTrackUrl = URL.createObjectURL(blob);
      const track = document.createElement("track");
      track.kind = "subtitles";
      track.label = file.name;
      track.srclang = "en";
      track.src = state.currentTrackUrl;
      track.default = true;
      els.video.appendChild(track);

      track.addEventListener("load", () => {
        if (els.video.textTracks[0]) {
          els.video.textTracks[0].mode = state.subtitlesEnabled ? "showing" : "disabled";
        }
      });

      setSubtitleState(true, "Subtitles On");
      setStatus(message);
    }

    function toggleSubtitles() {
      state.subtitlesEnabled = !state.subtitlesEnabled;
      const track = els.video.textTracks[0];
      if (track) {
        track.mode = state.subtitlesEnabled ? "showing" : "disabled";
      }
      els.subtitleToggleBtn.textContent = state.subtitlesEnabled ? "Subtitles On" : "Subtitles Off";
    }

    function setSubtitleState(enabled, label) {
      state.subtitlesEnabled = enabled;
      els.subtitleToggleBtn.disabled = !enabled;
      els.subtitleToggleBtn.textContent = label;
    }

    function clearTracks() {
      Array.from(els.video.querySelectorAll("track")).forEach((track) => track.remove());
      if (state.currentTrackUrl) {
        URL.revokeObjectURL(state.currentTrackUrl);
        state.currentTrackUrl = "";
      }
      setSubtitleState(false, "Subtitles Off");
    }

    function togglePlay() {
      if (!state.currentVideo) return;
      if (els.video.paused) {
        els.video.play().catch(() => setStatus("Chrome could not start playback yet.", true));
      } else {
        els.video.pause();
      }
    }

    function handleLoadedMetadata() {
      const saved = getSavedPosition(state.currentVideo);
      if (saved > 1 && Number.isFinite(els.video.duration) && saved < els.video.duration - 2) {
        els.video.currentTime = saved;
      }
      updateTimeline();
    }

    function handleTimeUpdate() {
      updateTimeline();
      if (!state.saveTimer) {
        state.saveTimer = window.setTimeout(() => {
          state.saveTimer = 0;
          saveCurrentPosition();
          renderPlaylist();
        }, 900);
      }
    }

    function updateTimeline() {
      const duration = Number.isFinite(els.video.duration) ? els.video.duration : 0;
      const current = Number.isFinite(els.video.currentTime) ? els.video.currentTime : 0;
      els.duration.textContent = formatTime(duration);
      els.currentTime.textContent = formatTime(current);

      if (!state.userSeeking) {
        els.seekRange.value = duration ? String(Math.round((current / duration) * 1000)) : "0";
      }
    }

    function handleSeekInput() {
      state.userSeeking = true;
      const duration = Number.isFinite(els.video.duration) ? els.video.duration : 0;
      const preview = duration * (Number(els.seekRange.value) / 1000);
      els.currentTime.textContent = formatTime(preview);
    }

    function handleSeekCommit() {
      const duration = Number.isFinite(els.video.duration) ? els.video.duration : 0;
      els.video.currentTime = duration * (Number(els.seekRange.value) / 1000);
      state.userSeeking = false;
      saveCurrentPosition();
    }

    function syncPlayButton() {
      els.playPauseBtn.textContent = els.video.paused ? String.fromCharCode(9654) : "II";
    }

    function syncVolume() {
      els.volumeRange.value = els.video.muted ? "0" : String(els.video.volume);
      els.muteBtn.textContent = els.video.muted || els.video.volume === 0
        ? String.fromCodePoint(128263)
        : String.fromCodePoint(128266);
    }

    function handleVideoError() {
      if (!state.currentVideo) return;
      setStatus("Chrome cannot play this file or codec: " + state.currentVideo.name, true);
    }

    function playNextVideo() {
      saveCurrentPosition(true);
      const index = state.videos.findIndex((item) => item.key === state.currentVideo.key);
      const next = state.videos[index + 1];
      if (next) loadVideo(next, true);
    }

    function handleShortcuts(event) {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement) return;
      if (event.code === "Space") {
        event.preventDefault();
        togglePlay();
      }
      if (event.code === "ArrowRight") {
        els.video.currentTime = Math.min((els.video.currentTime || 0) + 10, els.video.duration || 0);
      }
      if (event.code === "ArrowLeft") {
        els.video.currentTime = Math.max((els.video.currentTime || 0) - 10, 0);
      }
      if (event.code === "KeyF" && state.currentVideo) {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        } else {
          els.video.requestFullscreen().catch(() => {});
        }
      }
    }

    function saveCurrentPosition(forceEnded = false) {
      if (!state.currentVideo || !Number.isFinite(els.video.currentTime)) return;
      const duration = Number.isFinite(els.video.duration) ? els.video.duration : 0;
      const payload = {
        time: forceEnded || (duration && els.video.currentTime > duration - 3) ? 0 : els.video.currentTime,
        duration,
        updatedAt: Date.now()
      };
      localStorage.setItem(POSITION_PREFIX + state.currentVideo.key, JSON.stringify(payload));
    }

    function getSavedPosition(item) {
      if (!item) return 0;
      try {
        const raw = localStorage.getItem(POSITION_PREFIX + item.key);
        if (!raw) return 0;
        const payload = JSON.parse(raw);
        return Number(payload.time) || 0;
      } catch {
        return 0;
      }
    }

    function getProgressLabel(item) {
      try {
        const raw = localStorage.getItem(POSITION_PREFIX + item.key);
        if (!raw) return "New";
        const payload = JSON.parse(raw);
        if (!payload.duration || !payload.time) return "New";
        const percent = Math.min(99, Math.round((payload.time / payload.duration) * 100));
        return percent + "%";
      } catch {
        return "New";
      }
    }

    function revokeCurrentMediaUrls() {
      if (state.currentObjectUrl) {
        URL.revokeObjectURL(state.currentObjectUrl);
        state.currentObjectUrl = "";
      }
      clearTracks();
    }

    function srtToVtt(input) {
      const cleaned = input
        .replace(/^\uFEFF/, "")
        .replace(/\r+/g, "")
        .replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
      return "WEBVTT\n\n" + cleaned;
    }

    function parseFileName(name) {
      const index = name.lastIndexOf(".");
      if (index === -1) return { base: name, ext: "" };
      return {
        base: name.slice(0, index),
        ext: name.slice(index + 1).toLowerCase()
      };
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds <= 0) return "0:00";
      const total = Math.floor(seconds);
      const hrs = Math.floor(total / 3600);
      const mins = Math.floor((total % 3600) / 60);
      const secs = total % 60;
      if (hrs) return hrs + ":" + String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
      return mins + ":" + String(secs).padStart(2, "0");
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / Math.pow(1024, index);
      return value.toFixed(value >= 10 || index === 0 ? 0 : 1) + " " + units[index];
    }

    function setStatus(message, isError = false) {
      els.status.textContent = message;
      els.status.classList.toggle("error", isError);
    }

    function setEmptyState(title, copy) {
      els.emptyTitle.textContent = title;
      els.emptyCopy.textContent = copy;
      els.emptyState.classList.remove("hidden");
    }

    async function ensurePermission(handle) {
      if (!handle || !handle.queryPermission) return false;
      const options = { mode: "read" };
      if ((await handle.queryPermission(options)) === "granted") return true;
      if ((await handle.requestPermission(options)) === "granted") return true;
      return false;
    }

    function openDb() {
      return new Promise((resolve) => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          request.result.createObjectStore(HANDLE_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => resolve(null);
      });
    }

    function putInStore(key, value) {
      return new Promise((resolve) => {
        if (!state.db) {
          resolve(false);
          return;
        }
        const tx = state.db.transaction(HANDLE_STORE, "readwrite");
        tx.objectStore(HANDLE_STORE).put(value, key);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      });
    }

    function getFromStore(key) {
      return new Promise((resolve) => {
        if (!state.db) {
          resolve(null);
          return;
        }
        const tx = state.db.transaction(HANDLE_STORE, "readonly");
        const request = tx.objectStore(HANDLE_STORE).get(key);
        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => resolve(null);
      });
    }
  </script>
</body>
</html>
